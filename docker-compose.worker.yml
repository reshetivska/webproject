services:
  worker:
    build: ./backend
    command: celery -A app.celery_app worker -n ${WORKER_NAME:-worker}@%h --concurrency=${WORKER_CONCURRENCY:-2} -l info
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${MASTER_HOST}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@${MASTER_HOST}:6379/0
    restart: unless-stopped
