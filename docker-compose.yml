x-api: &api
  build: ./backend
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  environment: &api-env
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ADMIN_USERS: ${ADMIN_USERS:-admin}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  api1:
    <<: *api
    environment:
      <<: *api-env
      API_NAME: api1

  api2:
    <<: *api
    environment:
      <<: *api-env
      API_NAME: api2

  nginx:
    build: ./nginx
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - api1
      - api2

  worker1:
    profiles: ["local-workers"]
    build: ./backend
    command: celery -A app.celery_app worker -n worker1@%h --concurrency=2 -l info
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker2:
    profiles: ["local-workers"]
    build: ./backend
    command: celery -A app.celery_app worker -n worker2@%h --concurrency=2 -l info
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
